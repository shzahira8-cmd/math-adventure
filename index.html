<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Treasure Archipelago - 1-Minute Money Hunt</title>
<style>
*{box-sizing:border-box} html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#06243a;font-family:Arial,sans-serif;color:#fff}
#wrap{width:100vw;height:100vh;display:flex;align-items:center;justify-content:center;background:radial-gradient(#1b6c89,#041a2a)}
#scene{position:relative;width:min(100vw,177.68vh);height:min(100vh,56.28vw);aspect-ratio:1672/941;overflow:hidden;isolation:isolate}
#map{position:absolute;inset:0;width:100%;height:100%;object-fit:fill;user-select:none;pointer-events:none}
.hud{position:absolute;z-index:3;font-weight:900;text-shadow:0 2px 4px #42200a;color:#fff4c7;pointer-events:none}
#time{left:48.2%;top:5.4%;width:9%;text-align:center;font-size:clamp(12px,2.4vw,34px);color:#ffe66b}
#score{right:7.5%;top:6.2%;width:9%;text-align:center;font-size:clamp(10px,1.65vw,25px);color:#fff0b5}
#found{left:83.3%;top:10.2%;font-size:clamp(8px,1vw,15px);color:#fff}
.hotspot{position:absolute;z-index:4;transform:translate(-50%,-50%);width:4.2%;height:7.2%;border:0;border-radius:50%;background:transparent;cursor:pointer;padding:0;touch-action:manipulation}
.hotspot:focus-visible{outline:4px solid #fff;outline-offset:2px}
.hotspot:hover{background:#ffe36a30;box-shadow:0 0 0 3px #ffe36a99,0 0 22px #ffe36a}
.hotspot.found{pointer-events:none;opacity:.22;filter:grayscale(1)}
#startCover{position:absolute;z-index:10;inset:0;display:flex;align-items:center;justify-content:center;background:#00182bbd;padding:14px}
.panel{width:min(420px,92%);padding:22px;border-radius:20px;text-align:center;background:linear-gradient(145deg,#17425a,#071d32);border:2px solid #e7b957;box-shadow:0 14px 40px #0009}
.panel h2{margin:0 0 8px;color:#ffda75;font-size:clamp(22px,3vw,32px)}
.panel p{line-height:1.45;color:#e9f5fa;font-size:14px}
input{width:100%;padding:13px;border-radius:10px;border:2px solid #e7b957;font-size:17px;text-align:center;margin:8px 0;background:#fff;color:#142536}
button.action{border:0;border-radius:12px;padding:13px 18px;background:linear-gradient(#ffe56b,#f39b0b);color:#402500;font-weight:900;font-size:17px;cursor:pointer;box-shadow:0 4px 0 #98530c;touch-action:manipulation}
button.action:active{transform:translateY(2px);box-shadow:0 2px 0 #98530c}
#startBtn{width:100%}
#question,#finish,#pause{position:absolute;z-index:12;inset:0;display:none;align-items:center;justify-content:center;background:#00182bd9;padding:14px}
#question .panel,#finish .panel,#pause .panel{max-width:460px}
#answers{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin:15px 0}
#answers button{padding:12px 8px;border-radius:10px;border:1px solid #f5d77d;background:#f6e6b8;color:#33250d;font-weight:900;font-size:16px;cursor:pointer}
#answers button:disabled{opacity:.5;cursor:default}
#feedback{min-height:24px;font-weight:900;margin:8px 0}
#continue{width:100%;display:none}
#pauseBtn{position:absolute;z-index:6;right:1.2%;top:2%;width:4.8%;height:9%;border:0;border-radius:50%;background:#a65b16aa;color:white;font-size:clamp(14px,2vw,26px);cursor:pointer}
#pauseBtn:disabled{opacity:.4}
#rank{text-align:left;max-height:180px;overflow:auto;background:#03152388;padding:10px;border-radius:10px}
#mobileHint{position:absolute;left:2%;bottom:2%;z-index:3;background:#06243abf;padding:6px 9px;border-radius:8px;font-size:clamp(8px,.9vw,12px);pointer-events:none}
@media(max-aspect-ratio:1/1){#scene{width:100vw;height:auto;max-height:100vh}}
</style></head>
